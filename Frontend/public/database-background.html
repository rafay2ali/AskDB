<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;width:100%;height:100%;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 18);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
} catch {
  return;
}
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const dbGroup = new THREE.Group();
scene.add(dbGroup);

// Neon colors
const neonGreen = 0x00FF9C;
const neonCyan = 0x22D3EE;

// Create stacked cylinder wireframe disks (Database icon)
const diskCount = 4;
const diskRadius = 4.2;
const diskHeight = 1.3;
const spacing = 1.8;

for (let i = 0; i < diskCount; i++) {
  const y = (i - (diskCount - 1) / 2) * spacing;
  
  // Cylinder wireframe / edges
  const cylGeom = new THREE.CylinderGeometry(diskRadius, diskRadius, diskHeight, 32, 2, false);
  const edgesGeom = new THREE.EdgesGeometry(cylGeom);
  const lineMat = new THREE.LineBasicMaterial({ 
    color: i === 1 ? neonCyan : neonGreen, 
    transparent: true, 
    opacity: 0.95,
    linewidth: 1.5
  });
  const wireframeCyl = new THREE.LineSegments(edgesGeom, lineMat);
  wireframeCyl.position.y = y;
  dbGroup.add(wireframeCyl);

  // Inner subtle core disk glow
  const innerGeom = new THREE.CylinderGeometry(diskRadius * 0.98, diskRadius * 0.98, diskHeight * 0.95, 24);
  const meshMat = new THREE.MeshBasicMaterial({
    color: 0x031A10,
    transparent: true,
    opacity: 0.4
  });
  const innerMesh = new THREE.Mesh(innerGeom, meshMat);
  innerMesh.position.y = y;
  dbGroup.add(innerMesh);
}

// Orbiting outer data rings
const ringGeom1 = new THREE.RingGeometry(6.2, 6.28, 64);
const ringMat1 = new THREE.MeshBasicMaterial({ color: neonCyan, side: THREE.DoubleSide, transparent: true, opacity: 0.72 });
const ring1 = new THREE.Mesh(ringGeom1, ringMat1);
ring1.rotation.x = Math.PI / 2.3;
ring1.rotation.y = 0.3;
dbGroup.add(ring1);

const ringGeom2 = new THREE.RingGeometry(7.0, 7.08, 64);
const ringMat2 = new THREE.MeshBasicMaterial({ color: neonGreen, side: THREE.DoubleSide, transparent: true, opacity: 0.52 });
const ring2 = new THREE.Mesh(ringGeom2, ringMat2);
ring2.rotation.x = -Math.PI / 2.5;
ring2.rotation.y = -0.4;
dbGroup.add(ring2);

// Floating data particles
const particleCount = 200;
const pGeom = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const radius = 3.5 + Math.random() * 5.5;
  const py = (Math.random() - 0.5) * 12;
  pPositions[i * 3] = Math.cos(theta) * radius;
  pPositions[i * 3 + 1] = py;
  pPositions[i * 3 + 2] = Math.sin(theta) * radius;

  // Green or cyan color mix
  if (Math.random() > 0.3) {
    pColors[i * 3] = 0.0;
    pColors[i * 3 + 1] = 1.0;
    pColors[i * 3 + 2] = 0.61;
  } else {
    pColors[i * 3] = 0.13;
    pColors[i * 3 + 1] = 0.83;
    pColors[i * 3 + 2] = 0.93;
  }
}

pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
pGeom.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMaterial = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  transparent: true,
  opacity: 0.95
});
const particles = new THREE.Points(pGeom, pMaterial);
dbGroup.add(particles);

// Tilt group for isometric feel
dbGroup.rotation.x = 0.25;
dbGroup.rotation.z = -0.1;

// Mouse interaction tracking
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
});

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
let frameId = 0;
let parentPaused = false;
let clock = new THREE.Clock();
function animate() {
  if (document.hidden) return;
  if (!motionPreference.matches && !parentPaused) frameId = requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  
  dbGroup.rotation.y = elapsedTime * 0.4 + mouseX;
  dbGroup.rotation.x = 0.25 + mouseY * 0.5;
  
  ring1.rotation.z = elapsedTime * 0.3;
  ring2.rotation.z = -elapsedTime * 0.25;
  particles.rotation.y = -elapsedTime * 0.15;
  
  renderer.render(scene, camera);
}
function restart() {
  cancelAnimationFrame(frameId);
  animate();
}
document.addEventListener('visibilitychange', restart);
motionPreference.addEventListener('change', restart);
window.addEventListener('message', (event) => {
  if (event.source !== window.parent) return;
  if (event.data?.type === 'askdb-motion') { parentPaused = Boolean(event.data.paused); restart(); return; }
  if (event.data?.type !== 'askdb-pointer') return;
  mouseX = event.data.x * 0.4;
  mouseY = event.data.y * 0.4;
});
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->
</body>
</html>
